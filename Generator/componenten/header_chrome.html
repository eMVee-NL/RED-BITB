<div class="fake-tabs-bar chrome" id="bitbTabsBar">
    <div class="chrome-dots">
        <span class="dot red" onclick="closeFakeWindow()"></span>
        <span class="dot yellow" onclick="minimizeFakeWindow(event)"></span>
        <span class="dot green" onclick="maximizeFakeWindow(event)"></span>
    </div>
    <div class="tab-list" style="margin-left: 15px;">
        <div class="fake-tab active" data-tab="tab1" onclick="switchTab('tab1', 'https://google.com')">
            <span class="tab-title">📥 Inloggen - Google Accounts</span>
        </div>
    </div>
</div>
<div class="fake-header chrome" id="bitbHeader">
    <form class="address-form" onsubmit="handleUrlSubmit(event)">
        <span class="lock">🔒</span>
        <input type="text" id="fakeUrlInput" class="address-input" value="https://google.com">
    </form>
</div>
