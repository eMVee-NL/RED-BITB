<div class="fake-tabs-bar firefox" id="bitbTabsBar">
    <div class="tab-list">
        <div class="fake-tab active" data-tab="tab1" onclick="switchTab('tab1', 'https://firefox.com')">
            <span class="tab-title">🦊 Aanmelden bij Firefox-account</span>
        </div>
        <div class="fake-tab" data-tab="tab2" onclick="switchTab('tab2', 'https://mozilla.org')">
            <span class="tab-title">📄 Mozilla Privacy</span>
            <span class="tab-close" onclick="closeTab(event, 'tab2')">✕</span>
        </div>
    </div>
    <div class="window-controls">
        <div class="win-btn" onclick="minimizeFakeWindow(event)">➖</div>
        <div class="win-btn" onclick="maximizeFakeWindow(event)">🔲</div>
        <div class="win-btn close" onclick="closeFakeWindow()">✕</div>
    </div>
</div>
<div class="fake-header firefox" id="bitbHeader">
    <div class="fx-nav">← → ↻</div>
    <form class="address-form" onsubmit="handleUrlSubmit(event)">
        <span class="lock">🔒</span>
        <input type="text" id="fakeUrlInput" class="address-input" value="https://firefox.com">
    </form>
</div>
