<div class="login-box safari" id="loginFormContainer">
    <div id="tab1-content" class="tab-content active">
        <div style="font-size: 36px; margin-bottom: 10px;">🍏</div>
        <h3 style="font-weight: 400; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">Apple ID</h3>
        <p style="font-size: 14px; margin-bottom: 25px; color: #666;">Beheer je Apple-account</p>
        <form onsubmit="stealCredentials(event)">
            <input type="text" id="inputUser" placeholder="Apple ID" required style="border-radius: 6px; padding: 10px;"><br><br>
            <input type="password" id="inputPass" placeholder="Wachtwoord" required style="border-radius: 6px; padding: 10px;"><br><br>
            <button type="submit" class="btn-sf" style="background-color: #000000; color: white; border-radius: 6px;">Log in</button>
        </form>
    </div>
    <div id="tab2-content" class="tab-content" style="display: none; text-align: left;">
        <h3 style="font-weight: 400;">Apple en Privacy</h3>
        <p style="font-size: 13px; line-height: 1.6; color: #555;">
            Privacy is een fundamenteel mensenrecht. Dit tabblad simuleert de juridische documentatie van Apple binnen de gesimuleerde Safari-browseromgeving.
        </p>
    </div>
</div>
