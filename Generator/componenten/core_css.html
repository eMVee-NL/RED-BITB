<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f2f5; margin: 0; padding: 20px;
        display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden;
    }
    .launcher-box {
        max-width: 600px; background: white; padding: 30px; border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; margin-top: 50px; border: 1px solid #e2e8f0;
    }
    .open-btn { background-color: #0284c7; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: 600; }
    
    .fake-window {
        display: none; position: absolute; top: 150px; left: 200px; width: 540px; height: 460px;
        background: white; border: 1px solid #b8b8b8; box-shadow: 0 12px 40px rgba(0,0,0,0.25); overflow: hidden; z-index: 9999; transition: all 0.15s ease-out;
    }
    .fake-window.maximized { top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; border: none; }
    .fake-window.minimized { top: calc(100vh - 45px) !important; left: 20px !important; width: 280px !important; height: 40px !important; }

    /* ==========================================================================
       TABBLADEN BALK ONTWERP (LIGHT MODE BASE)
       ========================================================================== */
    .fake-tabs-bar { height: 36px; display: flex; align-items: flex-end; justify-content: space-between; user-select: none; }
    .fake-tabs-bar.edge { background: #e1e3e6; border-bottom: 1px solid #d2d2d2; cursor: move; }
    .fake-tabs-bar.chrome { background: #e1e3e6; border-bottom: 1px solid #b8b8b8; cursor: move; padding-left: 10px; }
    .fake-tabs-bar.firefox { background: #e1e3e6; border-bottom: 1px solid #b8b8b8; cursor: move; }
    .fake-tabs-bar.safari { background: #e1e3e6; border-bottom: 1px solid #cbd5e1; cursor: move; }
    
    .tab-list { display: flex; gap: 4px; }
    .fake-tab {
        background: rgba(0,0,0,0.05); color: #333; font-size: 11px; padding: 6px 12px;
        border-radius: 6px 6px 0 0; cursor: pointer; display: flex; align-items: center; gap: 8px; max-width: 180px;
    }
    .fake-tab.active { background: white; border: 1px solid #cbd5e1; border-bottom: none; font-weight: 600; }
    .tab-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab-close { font-size: 9px; color: #888; padding: 2px; }
    .tab-close:hover { background: #ddd; color: #000; border-radius: 50%; }

    /* ==========================================================================
       ADRESBALK ONTWERP (LIGHT MODE BASE)
       ========================================================================== */
    .fake-header { padding: 6px 10px; display: flex; align-items: center; gap: 15px; background: white; border-bottom: 1px solid #cbd5e1; }
    .edge-nav, .fx-nav, .mac-nav { font-size: 15px; color: #5f5f5f; user-select: none; }
    .chrome-dots, .mac-dots { display: flex; gap: 6px; padding-bottom: 12px; padding-left: 5px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; }
    .dot.red { background: #ff5f56; } .dot.yellow { background: #ffbd2e; } .dot.green { background: #27c93f; }

    .address-form { flex-grow: 1; display: flex; position: relative; }
    .address-input { width: 100%; background: #f1f5f9; border: 1px solid transparent; border-radius: 10px; padding: 5px 12px 5px 30px; font-size: 12px; outline: none; }
    .address-input:focus { background: white; border-color: #0284c7; }
    .lock { position: absolute; left: 10px; top: 5px; font-size: 12px; color: #107c41; }

    /* ==========================================================================
       VENSTERKNOPPEN ONTWERP (LIGHT MODE BASE)
       ========================================================================== */
    .window-controls { display: flex; height: 100%; align-items: center; }
    .win-btn { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; color: #000; }
    .win-btn:hover { background: rgba(0,0,0,0.05); }
    .win-btn.close:hover { background: #e81123; color: white; }

    /* ==========================================================================
       AUTOMATIC DARK THEME ENGINE OVERRIDES (ONLY OUTER BROWSER FRAME)
       ========================================================================== */
    .fake-window.dark-theme {
        border-color: #3c4043;
    }

    /* Dark Mode: Browser Tabs Bar Panel Backgrounds */
    .fake-window.dark-theme .fake-tabs-bar.edge { background: #2b2b2b; border-bottom: 1px solid #1a1a1a; }
    .fake-window.dark-theme .fake-tabs-bar.chrome { background: #202124; border-bottom: 1px solid #3c4043; }
    .fake-window.dark-theme .fake-tabs-bar.firefox { background: #1c1b22; border-bottom: 1px solid #0c0c0d; }
    .fake-window.dark-theme .fake-tabs-bar.safari { background: #262626; border-bottom: 1px solid #1a1a1a; }

    /* Dark Mode: Tab Elements Styles (Inactieve tabbladen) */
    .fake-window.dark-theme .fake-tab { background: rgba(255, 255, 255, 0.07) !important; color: #fbfbfe !important; border-color: transparent !important; }
    
    /* Dark Mode: Actieve tabbladen per specifieke browser (Dwingt donkere achtergrond af!) */
    .fake-window.dark-theme .fake-tabs-bar.chrome .fake-tab.active { background: #35363a !important; border-color: #3c4043 !important; color: #ffffff !important; }
    .fake-window.dark-theme .fake-tabs-bar.firefox .fake-tab.active { background: #42414d !important; border-color: transparent !important; color: #ffffff !important; }
    .fake-window.dark-theme .fake-tabs-bar.edge .fake-tab.active { background: #3b3b3b !important; border-color: #1a1a1a !important; color: #ffffff !important; }
    .fake-window.dark-theme .fake-tabs-bar.safari .fake-tab.active { background: #323232 !important; border-color: transparent !important; color: #ffffff !important; }

    .fake-window.dark-theme .tab-close { color: #b1b1b3 !important; }
    .fake-window.dark-theme .tab-close:hover { background: #52525e !important; color: #fff !important; }

    /* Dark Mode: Address Bar Header Panels */
    .fake-window.dark-theme .fake-header { background: #35363a; border-bottom: 1px solid #3c4043; }
    .fake-window.dark-theme .edge-nav, .fake-window.dark-theme .fx-nav, .fake-window.dark-theme .mac-nav { color: #b0b3b8; }
    
    /* Firefox Specific Address Panel Header Background Alignment */
    .fake-window.dark-theme .fake-tabs-bar.firefox + .fake-header { background: #42414d; border-bottom: 1px solid #0c0c0d; }

    /* Dark Mode: URL Box Invoerveld */
    .fake-window.dark-theme .address-input { background: #202124 !important; color: #ffffff !important; }
    .fake-window.dark-theme .address-input:focus { background: #28292c !important; }
    .fake-window.dark-theme .lock { color: #81c784; }

    /* Firefox Specific URL Box Inside Field Background Alignment */
    .fake-window.dark-theme .fake-tabs-bar.firefox + .fake-header .address-input { background: #2b2a33 !important; color: #fbfbfe !important; }

    /* Dark Mode: Window Buttons (With Support for Unicode Emojis) */
    .fake-window.dark-theme .win-btn { color: #ffffff !important; }
    .fake-window.dark-theme .win-btn:hover { background: rgba(255, 255, 255, 0.15) !important; }
    .fake-window.dark-theme .win-btn.close:hover { background: #e81123 !important; color: white !important; }

    /* ==========================================================================
       LOGIN CONTENT AREA (ALWAYS RENDERED REALISTIC LIGHT)
       ========================================================================== */
    .fake-content { background: white !important; height: calc(100% - 80px); overflow-y: auto; }
    .login-box { padding: 40px; text-align: center; background: white !important; color: #000 !important; }
    .login-box input { width: 100%; padding: 10px; margin: 8px 0; background: white !important; border: 1px solid #cbd5e1 !important; border-radius: 4px; box-sizing: border-box; font-size: 14px; color: #000 !important; }
    .login-box button { width: 100%; color: white; border: none; padding: 10px; cursor: pointer; font-weight: bold; border-radius: 4px; margin-top: 15px; }
    
    /* ==========================================================================
       LOGOS, ANIMATIONS & STATE TOGGLES
       ========================================================================== */
    .logo-ms { font-size: 11px; font-weight: bold; letter-spacing: 2px; line-height: 10px; margin-bottom: 15px; color: #0067b8; }
    .btn-ms { background-color: #0067b8; } .btn-go { background-color: #1a73e8; }
    .loader-spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #eaeaea; border-top: 4px solid #0284c7; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .fake-window.minimized .fake-content, .fake-window.minimized .fake-header { display: none; }
</style>
